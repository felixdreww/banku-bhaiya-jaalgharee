name: Build Windows Exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name "Banku_Bhaiya_Jaal_Gharee" spidey.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Banku_Bhaiya_Jaal_Gharee_Windows
          path: dist/*.exe
